<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>CONNECT HUB | مشاركة الشاشة</title>
  <link rel="stylesheet" href="/static/style.css">
  <style>
    body{margin:0;min-height:100vh;font-family:Tahoma,Arial,sans-serif;color:#f3fbff;background:radial-gradient(circle at 80% 10%,#174d69,transparent 55%),linear-gradient(145deg,#07131c,#152c3c);display:flex;align-items:center;justify-content:center;padding:20px}
    *{box-sizing:border-box}
    .panel{width:100%;max-width:520px;padding:30px 24px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.18);border-radius:25px;box-shadow:0 20px 60px #0006;backdrop-filter:blur(20px)}
    .logo{font-size:27px;font-weight:900;text-align:center}.logo span{color:#79e0bb}
    h1{text-align:center;font-size:24px;margin-top:25px}
    p{line-height:1.9;color:#d0dfe7}
    .row{display:flex;gap:12px;flex-wrap:wrap;margin:20px 0}
    button{cursor:pointer;border:0;border-radius:14px;padding:15px;font-size:16px;font-weight:bold;flex:1;min-width:170px}
    #start{background:#78ddba;color:#092d2a}#stop{background:#d96c7a;color:white}
    button:disabled{opacity:.5;cursor:not-allowed}
    .status{color:#8de6c8;margin-top:15px;min-height:1.5em;overflow-wrap:anywhere}
    .video{background:#030b12;border-radius:17px;min-height:200px;display:grid;place-items:center;overflow:hidden;position:relative}
    video{width:100%;max-height:350px}
    #placeholder{color:#91a8b7;text-align:center}
    .hidden{display:none!important}
    .note{font-size:13px;text-align:center;margin-top:18px}
  </style>
</head>
<body>
<main class="panel">
  <div class="logo">CONNECT <span>HUB</span></div>
  <h1>الاتصال ومشاركة الشاشة</h1>
  <p>عند بدء المشاركة واختيار شاشتك من نافذة إذن النظام، سيشاهد الطرف الآخر محتوى الشاشة. يمكنك إيقاف المشاركة من هذا الهاتف في أي وقت.</p>
  <p id="compat" class="status" role="status"></p>
  <div class="row">
    <button id="start" type="button" disabled>بدء مشاركة الشاشة</button>
    <button id="stop" type="button" class="hidden">إيقاف المشاركة</button>
  </div>
  <p id="msg" class="status" aria-live="polite"></p>
  <div class="video">
    <video id="preview" autoplay playsinline muted aria-label="معاينة الشاشة التي تشاركها"></video>
    <div id="placeholder">بانتظار بدء الاتصال</div>
  </div>
  <p class="note">تعمل المشاركة في المتصفحات الداعمة لها فقط، وبموافقة صاحب الجهاز. يبقى زر الإيقاف متاحاً أثناء المشاركة.</p>
</main>
<script src="/static/share.js?v=1.4.2"></script>
</body>
</html>
