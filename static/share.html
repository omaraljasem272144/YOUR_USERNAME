
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CONNECT HUB</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;min-height:100vh;
 font-family:Tahoma,Arial,sans-serif;
 color:#f3fbff;
 background:radial-gradient(circle at 80% 10%,#174d69,transparent 55%),
 linear-gradient(145deg,#07131c,#152c3c);
 display:flex;align-items:center;justify-content:center;
 padding:20px
}
.panel{
 width:100%;max-width:520px;
 padding:30px 24px;
 background:rgba(255,255,255,.07);
 border:1px solid rgba(255,255,255,.18);
 border-radius:25px;
 box-shadow:0 20px 60px #0006;
 backdrop-filter:blur(20px)
}
.logo{font-size:27px;font-weight:900;text-align:center}
.logo span{color:#79e0bb}
h1{text-align:center;font-size:24px;margin-top:28px}
p{line-height:1.9;color:#d0dfe7}
.row{display:flex;gap:12px;flex-wrap:wrap;margin:20px 0}
button{
 cursor:pointer;border:0;border-radius:14px;
 padding:15px;font-size:16px;font-weight:bold;
 flex:1;min-width:170px
}
#start{background:#78ddba;color:#092d2a}
#stop{background:#d96c7a;color:white}
button:disabled{opacity:.5;cursor:not-allowed}
.status{color:#8de6c8;margin-top:15px}
.video{
 background:#030b12;border-radius:17px;
 min-height:200px;display:grid;place-items:center;
 overflow:hidden
}
video{width:100%;max-height:350px}
#placeholder{text-align:center;color:#91a8b7}
.hidden{display:none!important}
.note{font-size:13px;text-align:center;margin-top:18px}
</style>
</head>
<body>
<main class="panel">
  <div class="logo">CONNECT <span>HUB</span></div>
  <h1>الاتصال ومشاركة الشاشة</h1>
  <p>
    يمكنك بدء مشاركة شاشة جهازك بعد الموافقة
    على إذن النظام. ستظهر الشاشة للطرف الآخر
    أثناء الاتصال، ويمكنك إيقاف المشاركة
    في أي وقت.
  </p>

  <div id="compat" class="status"></div>

  <div class="row">
    <button id="start" disabled>بدء مشاركة الشاشة</button>
    <button id="stop" class="hidden">إيقاف المشاركة</button>
  </div>

  <p id="msg" class="status" aria-live="polite"></p>

  <div class="video">
    <video id="preview" autoplay playsinline muted></video>
    <div id="placeholder">بانتظار بدء الاتصال</div>
  </div>

  <p class="note">
    تعمل مشاركة الشاشة في المتصفحات التي تدعمها.
    ويبقى إيقاف المشاركة متاحاً من جهازك.
  </p>
</main>
<script src="/static/share.js"></script>
</body>
</html>
